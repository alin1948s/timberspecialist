      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="20" fill="#f8fafc" stroke="url(#ippcGrad)" stroke-width="5"/>
  <rect x="20" y="20" width="160" height="160" rx="14" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- Wheat Ear / IPPC Emblem -->
